<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRINDAPAN GAMES</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --bg-dark: #0a0512; --card-bg: #130a21; --red-neon: #ff0055; --purple-neon: #9d00ff; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body { background-color: var(--bg-dark); color: #fff; padding-bottom: 50px; }
        header { text-align: center; padding: 30px 0; background: rgba(19, 10, 33, 0.9); border-bottom: 2px solid var(--purple-neon); }
        .logo { font-family: 'Orbitron', sans-serif; font-size: 2.2rem; font-weight: 800; background: linear-gradient(45deg, var(--red-neon), var(--purple-neon)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-shadow: 0 0 15px rgba(255, 0, 85, 0.6); }
        .container { max-width: 900px; margin: 30px auto; padding: 0 20px; }
        .search-box { position: relative; margin-bottom: 30px; }
        .search-box input { width: 100%; padding: 15px 20px 15px 50px; background: var(--card-bg); border: 2px solid var(--purple-neon); border-radius: 10px; color: #fff; font-size: 1rem; outline: none; box-shadow: 0 0 10px rgba(157, 0, 255, 0.3); }
        .search-box i { position: absolute; left: 20px; top: 50%; transform: translateY(-50%); color: var(--purple-neon); }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; margin-bottom: 40px; }
        .card { background: var(--card-bg); border: 1px solid rgba(157, 0, 255, 0.3); border-radius: 12px; overflow: hidden; transition: 0.3s; }
        .card:hover { transform: translateY(-5px); border-color: var(--red-neon); box-shadow: 0 0 15px rgba(255, 0, 85, 0.4); }
        .card img { width: 100%; height: 130px; object-fit: cover; }
        .card-body { padding: 15px; text-align: center; }
        .card-title { font-weight: 600; margin-bottom: 10px; font-size: 1rem; }
        .btn-get { display: block; background: linear-gradient(45deg, var(--red-neon), var(--purple-neon)); color: #fff; text-decoration: none; padding: 8px 0; border-radius: 6px; font-weight: bold; }
        .socials { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; }
        .btn-social { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 12px; border-radius: 8px; color: #fff; text-decoration: none; font-weight: bold; }
        .yt { background: #ff0000; } .discord { background: var(--purple-neon); } .btn-extra { background: #1f1435; border: 1px solid var(--purple-neon); }
    </style>
</head>
<body>
    <header><div class="logo">PRINDAPAN GAMES</div></header>
    <div class="container">
        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="searchInput" onkeyup="filterCards()" placeholder="Cari data game / script...">
        </div>
        <div class="grid" id="cardGrid"></div>
        <div class="socials">
            <a href="https://youtube.com" target="_blank" class="btn-social yt"><i class="fa-brands fa-youtube"></i> SUBSCRIBE YT</a>
            <a href="https://discord.gg" target="_blank" class="btn-social discord"><i class="fa-brands fa-discord"></i> SALURAN</a>
            <a href="#" class="btn-social btn-extra"><i class="fa-solid fa-link"></i> SLOT 3</a>
            <a href="#" class="btn-social btn-extra"><i class="fa-solid fa-link"></i> SLOT 4</a>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDSftuyANybsSrzM7M8mvLJrd8-HhEn1BU",
            authDomain: "prindapan-games.firebaseapp.com",
            databaseURL: "https://prindapan-games-default-rtdb.firebaseio.com",
            projectId: "prindapan-games",
            storageBucket: "prindapan-games.firebasestorage.app",
            messagingSenderId: "280001797119",
            appId: "1:280001797119:web:35a8d16371faf98b4c65ca",
            measurementId: "G-863VM2SE3W"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        db.ref('links').on('value', (snapshot) => {
            const grid = document.getElementById('cardGrid');
            grid.innerHTML = '';
            const data = snapshot.val();
            for (let id in data) {
                const item = data[id];
                grid.innerHTML += `
                    <div class="card" data-title="${item.title.toLowerCase()}">
                        <img src="${item.img || 'https://via.placeholder.com/300x150'}" alt="Thumb">
                        <div class="card-body">
                            <div class="card-title">${item.title}</div>
                            <a href="${item.url}" target="_blank" class="btn-get">AMBIL DATA</a>
                        </div>
                    </div>
                `;
            }
        });

        function filterCards() {
            const input = document.getElementById('searchInput').value.toLowerCase();
            const cards = document.querySelectorAll('.card');
            cards.forEach(card => {
                const title = card.getAttribute('data-title');
                card.style.display = title.includes(input) ? 'block' : 'none';
            });
        }
    </script>
</body>
</html>
