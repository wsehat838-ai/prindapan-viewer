<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRINDAPAN VAULT HUB</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #090514;
            --card-bg: #130a24;
            --card-border: #261547;
            --accent-pink: #ff0077;
            --accent-purple: #8a2be2;
            --accent-blue: #00d2ff;
            --text-gray: #a49bba;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
            position: relative;
        }

        /* POPUP FLOATING STREAM (TOP SLIDE) */
        .chat-popup-container {
            position: fixed;
            top: -150px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 420px;
            background: #130a24;
            border: 1px solid var(--accent-blue);
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0, 210, 255, 0.35);
            z-index: 99999;
            overflow: hidden;
            transition: top 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .chat-popup-container.show {
            top: 20px;
        }

        .chat-popup-content {
            padding: 12px 15px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .chat-popup-header {
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.7rem;
            font-weight: 800;
            color: var(--accent-blue);
            letter-spacing: 1px;
        }

        .chat-popup-body {
            font-size: 0.85rem;
            color: #fff;
            font-weight: 600;
            word-break: break-word;
            line-height: 1.4;
        }

        .chat-progress-bar {
            height: 4px;
            background: linear-gradient(90deg, var(--accent-pink), var(--accent-blue));
            width: 100%;
            transform-origin: left;
        }

        @keyframes shrinkBar {
            from { transform: scaleX(1); }
            to { transform: scaleX(0); }
        }

        .chat-progress-bar.run-timer {
            animation: shrinkBar 10s linear forwards;
        }

        /* BANNER HEADER */
        .app-container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .hero-banner {
            position: relative;
            width: 100%;
            height: 160px;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid var(--card-border);
            display: flex;
            align-items: flex-end;
            padding: 15px;
            background: url('https://i.ibb.co/L5X8P0M/banner.jpg') center/cover no-repeat;
        }

        .hero-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(9, 5, 20, 0.2) 0%, rgba(9, 5, 20, 0.9) 100%);
        }

        .hero-content {
            position: relative;
            z-index: 2;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .hero-logo {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: 2px solid var(--accent-pink);
        }

        .hero-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.1rem;
            font-weight: 900;
            letter-spacing: 1px;
            color: #fff;
            text-shadow: 0 0 10px rgba(0,210,255,0.5);
        }

        /* MAIN CARD VAULT */
        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .card-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.9rem;
            font-weight: 800;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card-title i { color: var(--accent-pink); }

        .search-box {
            position: relative;
            width: 100%;
        }

        .search-box i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-gray);
            font-size: 0.9rem;
        }

        .search-input {
            width: 100%;
            padding: 12px 12px 12px 40px;
            background: #090412;
            border: 1px solid var(--card-border);
            border-radius: 10px;
            color: #fff;
            font-size: 0.8rem;
            outline: none;
        }

        .search-input:focus { border-color: var(--accent-pink); }

        .link-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-height: 80px;
        }

        .link-item {
            background: #090412;
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .link-info {
            display: flex;
            align-items: center;
            gap: 10px;
            overflow: hidden;
        }

        .link-thumb {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            object-fit: cover;
            border: 1px solid var(--card-border);
        }

        .link-text {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .link-text strong {
            font-size: 0.85rem;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .btn-get {
            background: linear-gradient(45deg, var(--accent-pink), var(--accent-purple));
            color: #fff;
            text-decoration: none;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 700;
            font-family: 'Orbitron', sans-serif;
            white-space: nowrap;
        }

        /* GRID TOMBOL SOSMED & CONTACT */
        .nav-links {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .btn-socmed {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            color: #fff;
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: 700;
            transition: 0.3s;
        }

        .btn-yt { color: #ff0000; border-color: rgba(255, 0, 0, 0.3); }
        .btn-wa { color: #25d366; border-color: rgba(37, 211, 102, 0.3); }

        /* TOMBOL HUBUNGI ADMIN (TENGAH BAWAH) */
        .btn-admin {
            grid-column: span 2;
            background: linear-gradient(45deg, rgba(0, 210, 255, 0.15), rgba(138, 43, 226, 0.15));
            border: 1px solid var(--accent-blue);
            color: var(--accent-blue);
            padding: 12px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 800;
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 0.5px;
            box-shadow: 0 0 12px rgba(0, 210, 255, 0.2);
        }

        .empty-state {
            text-align: center;
            color: var(--text-gray);
            font-size: 0.8rem;
            padding: 20px 0;
        }
    </style>
</head>
<body>

    <!-- POPUP LIVE CHAT FLOATING -->
    <div id="liveChatPopup" class="chat-popup-container">
        <div class="chat-popup-content">
            <div class="chat-popup-header">
                <i class="fa-solid fa-bullhorn"></i>
                <span>PESAN ADMIN</span>
            </div>
            <div id="chatPopupText" class="chat-popup-body">-</div>
        </div>
        <div id="chatProgressBar" class="chat-progress-bar"></div>
    </div>

    <div class="app-container">

        <!-- BANNER HERO -->
        <div class="hero-banner">
            <div class="hero-overlay"></div>
            <div class="hero-content">
                <img src="https://i.ibb.co/3kW22p1/logo.jpg" class="hero-logo" alt="Logo" onerror="this.src='https://via.placeholder.com/45'">
                <div class="hero-title">PRINDAPAN VAULT HUB</div>
            </div>
        </div>

        <!-- SEARCH & LINK VAULT -->
        <div class="card">
            <div class="card-title">
                <i class="fa-solid fa-folder-open"></i> DOWNLOAD VAULT
            </div>
            
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" class="search-input" placeholder="Cari apa? Ketik..." oninput="filterLinks()">
            </div>

            <div id="linkList" class="link-list">
                <div class="empty-state">Memuat data...</div>
            </div>
        </div>

        <!-- NAV LINKS & CONTACT ADMIN -->
        <div class="nav-links">
            <a href="https://youtube.com" target="_blank" class="btn-socmed btn-yt">
                <i class="fa-brands fa-youtube"></i> YouTube
            </a>
            <a href="https://whatsapp.com" target="_blank" class="btn-socmed btn-wa">
                <i class="fa-brands fa-whatsapp"></i> Komunitas WA
            </a>

            <!-- TOMBOL HUBUNGI ADMIN LANGSUNG -->
            <a href="https://wa.me/6283139352624?text=Halo%20Admin%20Prindapan,%20saya%20mau%20tanya..." target="_blank" class="btn-admin">
                <i class="fa-solid fa-headset"></i> HUBUNGI ADMIN
            </a>
        </div>

    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDSftuyANybsSrzM7M8mvLJrd8-HhEn1BU",
            authDomain: "prindapan-games.firebaseapp.com",
            databaseURL: "https://prindapan-games-default-rtdb.firebaseio.com",
            projectId: "prindapan-games",
            storageBucket: "prindapan-games.firebasestorage.app",
            messagingSenderId: "280001797119",
            appId: "1:280001797119:web:35a8d16371faf98b4c65ca",
            measurementId: "G-863VM2SE3W"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let allLinks = {};

        // REALTIME LISTENER DAFTAR LINK
        db.ref('links').on('value', (snapshot) => {
            allLinks = snapshot.val() || {};
            renderLinks(allLinks);
        });

        function renderLinks(data) {
            const listEl = document.getElementById('linkList');
            listEl.innerHTML = '';

            const keys = Object.keys(data);
            if (keys.length === 0) {
                listEl.innerHTML = '<div class="empty-state">Belum ada link yang ditambahkan.</div>';
                return;
            }

            keys.forEach(key => {
                const item = data[key];
                const imgSrc = item.img ? item.img : 'https://via.placeholder.com/40';
                listEl.innerHTML += `
                    <div class="link-item">
                        <div class="link-info">
                            <img src="${imgSrc}" class="link-thumb" alt="Thumb" onerror="this.src='https://via.placeholder.com/40'">
                            <div class="link-text">
                                <strong>${item.title}</strong>
                            </div>
                        </div>
                        <a href="${item.url}" target="_blank" class="btn-get">UNDUH</a>
                    </div>
                `;
            });
        }

        function filterLinks() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = {};

            for (let key in allLinks) {
                if (allLinks[key].title.toLowerCase().includes(query)) {
                    filtered[key] = allLinks[key];
                }
            }
            renderLinks(filtered);
        }

        // REALTIME LISTENER POPUP BROADCAST (DURASI 10 DETIK)
        let popupTimeout;
        db.ref('liveBroadcast').on('value', (snapshot) => {
            const data = snapshot.val();
            if (data && data.text) {
                triggerLiveChatPopup(data.text);
            }
        });

        function triggerLiveChatPopup(text) {
            const popup = document.getElementById('liveChatPopup');
            const textEl = document.getElementById('chatPopupText');
            const progressBar = document.getElementById('chatProgressBar');

            clearTimeout(popupTimeout);
            popup.classList.remove('show');
            progressBar.classList.remove('run-timer');

            void progressBar.offsetWidth;

            textEl.innerText = text;

            popup.classList.add('show');
            progressBar.classList.add('run-timer');

            popupTimeout = setTimeout(() => {
                popup.classList.remove('show');
                progressBar.classList.remove('run-timer');
            }, 10000);
        }
    </script>
</body>
</html>
